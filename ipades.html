<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffd23f">
<title>EasyLandX · Mobile Showcase (ES)</title>
<style>
:root{--gold:#ffd23f;--cyan:#27f0ff;--deep:#1c0a5c;--w:min(100vw,560px,max(390px,50dvh))}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
html.touch,html.touch body{height:auto;overflow:visible;overscroll-behavior:none}
html.touch body{min-height:calc(100dvh + 400px)}
html{background:#ffd23f} /* colour around the notch / island: change here and in the theme-color meta */
body{background:transparent;color:#fff;font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:0;touch-action:none;cursor:grab}
.desk{--w:100vw}
.desk .screen{box-shadow:none}
.desk .bg{display:none}
.screen{position:fixed;top:0;bottom:0;width:var(--w);left:calc(50% - var(--w)/2);overflow:hidden;background:#12082e;z-index:1;box-shadow:0 0 70px rgba(0,0,0,.55)}
.track{position:absolute;inset:0;display:flex;will-change:transform}
.slide{flex:0 0 100%;position:relative;overflow:hidden;background:#12082e}
.slide.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12%;font-weight:800;font-size:20px;color:var(--gold)}
.slide iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0}
.zone{position:absolute;top:0;bottom:0;width:26px;z-index:5;touch-action:none;cursor:grab}
.zl{left:0}.zr{right:0}
.glass{touch-action:pan-y;position:fixed;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:8px;border-radius:18px;background:rgba(24,8,72,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.45);width:min(96vw,500px)}
.bar{bottom:max(12px,env(safe-area-inset-bottom))}
.bar.min{width:auto}.bar.min>*:not(#tg):not(.count){display:none}
.count{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(6px);padding:5px 12px;border-radius:14px;background:rgba(24,8,72,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);font:700 13px/1 inherit;font-family:inherit;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
.count.show{opacity:1;transform:translateX(-50%)}
.b{border:0;border-radius:12px;padding:9px 11px;font:700 15px inherit;font-family:inherit;background:var(--gold);color:var(--deep);cursor:pointer;white-space:nowrap;text-decoration:none}
.b:active{transform:scale(.95)}
.b.alt{background:rgba(255,255,255,.18);color:#fff}
input{flex:1;min-width:0;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;padding:9px 11px;font:inherit;-webkit-user-select:text;user-select:text}
input:focus{outline:0;border-color:var(--cyan)}
.res{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:rgba(20,7,61,.95);border:1px solid rgba(255,255,255,.2);border-radius:14px;max-height:45vh;overflow:auto;display:none}
.res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.res div:hover,.res .on{background:rgba(39,240,255,.2)}
.res small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:19;background:rgba(0,0,0,.6);padding:7px 12px;border-radius:14px;font-size:12px;white-space:nowrap;pointer-events:none;animation:fade 6s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
@media(max-width:480px){.b{padding:9px 8px;font-size:14px}.glass{gap:5px;padding:7px}.hint{white-space:normal;width:86vw;text-align:center}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="screen" id="screen">
  <div class="track" id="track"><div class="slide"><div class="ph">Cargando sitios…</div></div></div>
</div>
<div class="glass bar" id="bar">
  <div class="res" id="res"></div>
  <div class="count" id="count"></div>
  <button class="b alt" id="prev" aria-label="Sitio anterior">◀</button>
  <button class="b" id="rnd" aria-label="Sitio aleatorio">🎲</button>
  <input id="q" type="search" placeholder="Buscar sitios…" autocomplete="off" aria-label="Título de la página y búsqueda">
  <button class="b" id="tr" aria-label="Traducción al español activada o desactivada" title="Traducción al español">🌐</button>
  <a class="b alt" id="open" href="#" target="_blank" rel="noopener" title="Abrir en una pestaña nueva" aria-label="Abrir en una pestaña nueva">↗</a>
  <button class="b alt" id="next" aria-label="Sitio siguiente">▶</button>
  <button class="b alt" id="tg" aria-label="Ocultar o mostrar controles">▾</button>
</div>
<div class="hint">Desliza ⇄ para cambiar de sitio · desliza ↕ para desplazarte · 🌐 activa o desactiva la traducción al español</div>

<script>
/* ?desk=1 (used by the big iPad frame on the landing page): always use the real DESKTOP layout, even on phones.
   Without it, the page keeps its normal behaviour (phone layout on phones / the small virtual iPhone). */
const EMB=/[?&]desk=1/.test(location.search);
if(!EMB&&matchMedia('(pointer:coarse)').matches)document.documentElement.classList.add('touch');
const IDX='https://easylandx.github.io/all/';
let W=390; // page width in CSS px: phone width, or the real window width on desktop
const $=s=>document.querySelector(s), track=$('#track'), scr=$('#screen'), q=$('#q'), res=$('#res');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const FALL='work make give disc parad core swan scou how brai trig change influence social human choice'.split(' ');
let S=[], cur=0;

async function loadList(){
  let list=[];
  try{
    const t=await (await fetch(IDX)).text(), seen=new Set();
    const d=new DOMParser().parseFromString(t,'text/html');
    d.querySelectorAll('a[href]').forEach(a=>{
      let u; try{u=new URL(a.getAttribute('href'),IDX)}catch(e){return}
      if(!/\/all\/[\w-]+\.html$/.test(u.pathname)||/\/index\.html$/.test(u.pathname)||seen.has(u.href))return;
      seen.add(u.href);
      let L=[...a.querySelectorAll('*')].filter(e=>!e.children.length).map(e=>e.textContent.trim()).filter(x=>x&&!/^Open\s*→?$/.test(x));
      if(!L.length)L=[a.textContent.replace(/Open\s*→/,'').trim()||cap(u.pathname.split('/').pop().replace('.html',''))];
      let ic=''; if(L.length>1&&/^[^\p{L}\p{N}]{1,8}$/u.test(L[0]))ic=L.shift();
      list.push({u:u.href,t:(ic?ic+' ':'')+L[0],d:L.slice(1).join(' ')});
    });
    if(list.length<20){ // page may be script-rendered: scan raw text for page names
      list=[]; seen.clear();
      for(const m of t.matchAll(/["'(\/]([a-z0-9-]+)\.html/gi)){
        const s=m[1]; if(['index','all'].includes(s)||seen.has(s))continue; seen.add(s);
        list.push({u:IDX+s+'.html',t:cap(s),d:''});
      }
    }
  }catch(e){}
  if(list.length<5) list=FALL.map(s=>({u:IDX+s+'.html',t:cap(s),d:''}));
  // Newest pages: always in the carousel (added at the end, skipped if the index already lists them)
  [['monk','🧘','Monk','Quiet focus, clear mind.'],['decided','✅','Decided','Choose, commit, move.'],['forward','➡️','Forward','Always one step ahead.'],
   ['breath','🌬️','Breath','Slow down, breathe in.'],['read','📖','Read','Read people like a book.'],['unlearn','🧠','Unlearn','Let old patterns go.'],['within','🧭','Within','Look inward.'],['youcan','💪','You Can','You can do it.']].forEach(([s,ic,t,d])=>{
    const u=IDX+s+'.html'; if(!list.some(o=>o.u===u))list.push({u:u,t:ic+' '+t,d:d});
  });
  return list;
}

function sizeF(f){const k=scr.clientWidth/W;f.style.width=W+'px';f.style.height=(scr.clientHeight/k)+'px';f.style.transform='scale('+k+')'}
function sync(){
  [...track.children].forEach((sl,i)=>{
    const need=Math.abs(i-cur)<=1, f=sl.querySelector('iframe');
    if(need&&!f)mkFrame(i);
    else if(!need&&f)f.remove();
  });
}
function ui(){
  if(document.activeElement!==q)q.value=S[cur].t; // the search box shows the current page title
  $('#open').href='https://easylandx.github.io/app/ipades.html?open='+encodeURIComponent(S[cur].u.split('/').pop().replace(/\.html$/,''));
}
function go(i){
  i=(i+S.length)%S.length;
  const far=Math.abs(i-cur)>1,chg=i!==cur; cur=i; sync();
  track.style.transition=far?'none':'transform .35s cubic-bezier(.2,.8,.2,1)';
  track.style.transform='translateX('+(-cur*100)+'%)';
  if(far){const sl=track.children[cur];sl.classList.remove('pop');void sl.offsetWidth;sl.classList.add('pop')}
  ui();
  if(chg)showCount();
}
let ct;
function showCount(){ // small temporary page counter above the search box
  const c=$('#count');c.textContent=(cur+1)+' / '+S.length;c.classList.add('show');
  clearTimeout(ct);ct=setTimeout(()=>c.classList.remove('show'),1300);
}
function rnd(){if(S.length<2)return;let i;do{i=Math.floor(Math.random()*S.length)}while(i===cur);go(i)}

/* =====================================================================
   REAL-TIME TRANSLATION TO SPANISH
   Every embedded page is same-origin (srcdoc), so we can walk its DOM, translate
   text nodes + a few attributes (placeholder, title, alt, aria-label) and keep a
   MutationObserver running so text added later by the page's own scripts is
   translated as well. Translations are cached in localStorage.
   Engine: Google's public "gtx" endpoint (auto-detects the source language).
   To use an official/paid API (Google Cloud Translation, DeepL...), replace gt().
   ===================================================================== */
const TKEY='ipad_tr_es_v9';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){return false}}};
const T={on:ls.get('ipad_tr_on')!=='0'};
let TC={};try{TC=JSON.parse(ls.get(TKEY)||'{}')||{}}catch(e){TC={}}
let tcDirty=false;
setInterval(()=>{if(!tcDirty)return;tcDirty=false;if(ls.set(TKEY,JSON.stringify(TC))===false){TC={}}},4000);

let act=0;const wait=[];
const slot=()=>new Promise(r=>{if(act<6){act++;r()}else wait.push(r)});
const free=()=>{const n=wait.shift();if(n)n();else act--};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Translation engines, tried in order. An engine that fails goes on a growing cooldown and the next one takes over,
   so if Google blocks one endpoint the page keeps translating. In the console: trStatus() shows each engine's state. */
const gj=j=>{
  if(j&&j.sentences)return j.sentences.map(x=>x.trans||'').join('');
  if(Array.isArray(j)){
    const a=j[0];
    if(typeof a==='string')return a;
    if(Array.isArray(a)){
      if(Array.isArray(a[0]))return a.map(x=>x[0]||'').join('');
      if(typeof a[0]==='string')return a[0];
    }
  }
  throw new Error('bad response');
};
const jget=async(url,sig)=>{const r=await fetch(url,{signal:sig});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const ENG=[
  {n:'google',max:3500,f:(s,g)=>jget('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q='+encodeURIComponent(s),g).then(gj)},
  {n:'google2',max:3500,f:(s,g)=>jget('https://translate.google.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q='+encodeURIComponent(s),g).then(gj)},
  {n:'chrome',max:3000,f:(s,g)=>jget('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=es&q='+encodeURIComponent(s),g).then(gj)},
  {n:'lingva',max:1500,f:(s,g)=>jget('https://lingva.ml/api/v1/auto/es/'+encodeURIComponent(s),g).then(j=>{if(!j||!j.translation)throw new Error('empty');return j.translation})},
  {n:'mymemory',max:450,f:(s,g)=>jget('https://api.mymemory.translated.net/get?langpair=Autodetect%7Ces&q='+encodeURIComponent(s),g).then(j=>{const t=j&&j.responseData&&j.responseData.translatedText;if(!t||+j.responseStatus!==200||/MYMEMORY WARNING|INVALID/i.test(t))throw new Error('quota');return t})}
];
ENG.forEach(e=>{e.cool=0;e.fails=0;e.err=''});
const allCool=()=>{const n=Date.now();return ENG.every(e=>e.cool>n)};
window.trStatus=()=>{const r=ENG.map(e=>({engine:e.n,fails:e.fails,cooldown_s:Math.max(0,Math.round((e.cool-Date.now())/1000)),lastError:e.err}));console.table(r);return r};
async function gtRaw(s){
  await slot();
  try{
    const now=Date.now();let last=null;
    for(const e of ENG){
      if(s.length>e.max||e.cool>now)continue;
      const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000); // never hang: 8 s timeout
      try{
        const t=await e.f(s,ac.signal);
        if(!t||!t.trim())throw new Error('empty');
        e.fails=0;e.err='';
        return t;
      }catch(er){
        e.fails++;e.err=String((er&&er.message)||er);
        e.cool=Date.now()+Math.min(180000,6000*Math.pow(2,e.fails-1));
        last=er;
      }finally{clearTimeout(tm)}
    }
    throw last||new Error('all engines cooling');
  }finally{free()}
}
// Batching: many short strings go in ONE request (joined by newlines) to avoid hitting rate limits
const bq=[];let bt=0;
function gt(s){return new Promise((res,rej)=>{bq.push({s,res,rej});if(!bt)bt=setTimeout(flush,60)})}
function flush(){
  bt=0;
  while(bq.length){
    const batch=[];let len=0;
    while(bq.length&&batch.length<30&&len+bq[0].s.length<3000){const it=bq.shift();batch.push(it);len+=it.s.length+1}
    if(!batch.length)batch.push(bq.shift());
    runBatch(batch);
  }
}
async function runBatch(b){
  if(b.length===1){try{b[0].res(await gtRaw(b[0].s))}catch(e){b[0].rej(e)}return}
  let out=null;
  try{out=(await gtRaw(b.map(x=>x.s.replace(/\n/g,' ')).join('\n'))).split('\n')}catch(e){out=null}
  if(out&&out.length===b.length){b.forEach((x,i)=>x.res(out[i].trim()));return}
  // failed or segment count mismatch: translate one by one
  await Promise.all(b.map(async x=>{try{x.res(await gtRaw(x.s))}catch(er){x.rej(er)}}));
}
async function trChunks(s){
  if(s.length<=1200)return gt(s);
  const parts=s.match(/[^.!?]+[.!?]*\s*/g)||[s],chunks=[];let c='';
  parts.forEach(p=>{if((c+p).length>1200&&c){chunks.push(c);c=''}c+=p});
  if(c)chunks.push(c);
  return (await Promise.all(chunks.map(gt))).join('');
}
/* =====================================================================
   GLOSSARY: fixes words the translator gets wrong out of context.  To add a term, add a line and bump TKEY (v7 -> v8).
   FORCE = [what to find, exact Spanish to use]   (the Spanish text is inserted as is: best for nouns / fixed phrases)
   KEEP  = terms left in English on purpose (brand + startup / web jargon)
   SUB   = [what to find, English word that translates correctly]. The replacement is still English, so verb forms
           keep conjugating (e.g. "ships" -> "launches" -> "lanza"). Capitalisation is preserved in all three lists.
   Order of use: FORCE and KEEP first (protected by placeholders), then SUB, then the translator.
   ===================================================================== */
const GROW='growth|sales|results|traffic|conversions?|revenue|engagement|success|innovation|business|leads';
const FORCE=[
  [/\btech stack\b/gi,'stack tecnológico'],
  [/\bsales pipeline\b/gi,'pipeline de ventas'],
  [/\bhero section\b/gi,'sección principal'],
  [/\bhero image\b/gi,'imagen principal'],
  [/\bresponsive design\b/gi,'diseño adaptable'],
  [/\bmobile-responsive\b/gi,'adaptable a móviles'],
  [/\bresponsive\b/gi,'adaptable'],
  [/\brelease notes\b/gi,'notas de la versión'],
  [/\bseed round\b/gi,'ronda semilla'],
  [/\bseed funding\b/gi,'financiación semilla'],
  [/\bgrit\b/gi,'coraje']   // grit = coraje (not "arena")
];
const KEEP=new RegExp([
  'easy[\\s-]?land(?:[\\s-]?x)?',
  // web / marketing jargon commonly left in English in Spanish
  '\\blanding pages?\\b','\\bpitch decks?\\b','\\belevator pitch\\b','\\blead magnets?\\b','\\babove the fold\\b',
  '\\bbranding\\b','\\bportfolio\\b','\\bwireframes?\\b','\\bmobile-first\\b','\\bgrowth hacking\\b','\\bchangelog\\b',
  // startup jargon
  '\\bno-code\\b','\\blow-code\\b','\\bproduct-market fit\\b','\\bburn rate\\b','\\brunway\\b','\\bcap table\\b',
  '\\bpre-seed\\b','\\bbacklog\\b','\\bchurn\\b','\\bbuild in public\\b','\\bindie hackers?\\b',
  // acronyms
  '\\b(?:MVP|SaaS|B2B|B2C|API|SEO|CRM|KPIs?|ROI|UX|UI|CTA|CMS|SDK|MRR|ARR)\\b'
].join('|'),'gi');
const SUB=[
  // ship = launch (not "barco")
  [/\bshipped\b/gi,'launched'],[/\bships\b/gi,'launches'],[/\bship\b/gi,'launch'],
  [/\bshipping(?=\s+(?:faster|fast|features?|code|products?|updates?|software|every|daily|weekly|quickly|ideas?|apps?)\b)/gi,'launching'],
  // go live = launch (not "ir en vivo")
  [/\bwent live\b/gi,'launched'],[/\bgone live\b/gi,'launched'],[/\bgoing live\b/gi,'launching'],[/\bgoes live\b/gi,'launches'],[/\bgo live\b/gi,'launch'],
  // new release = new launch
  [/\bnew releases\b/gi,'new launches'],[/\bnew release\b/gi,'new launch'],
  // reach out = contact (not "alcanzar")
  [/\breached out\b/gi,'contacted'],[/\breaches out\b/gi,'contacts'],[/\breaching out\b/gi,'contacting'],[/\breach out\b/gi,'contact'],
  [/\bdrop us a line\b/gi,'write to us'],[/\bdrop me a line\b/gi,'write to me'],
  // drive growth = boost growth (not "conducir")
  [new RegExp('\\bdriving(?=\\s+(?:'+GROW+')\\b)','gi'),'boosting'],
  [new RegExp('\\bdrives(?=\\s+(?:'+GROW+')\\b)','gi'),'boosts'],
  [new RegExp('\\bdrive(?=\\s+(?:'+GROW+')\\b)','gi'),'boost'],
  // bootstrapped = self-funded
  [/\bbootstrapped\b/gi,'self-funded'],[/\bbootstrapping\b/gi,'self-funding'],
  // deck = presentation (not "mazo / cubierta")
  [/\bdecks\b/gi,'presentations'],[/\bdeck\b/gi,'presentation'],
  // pitch as a verb = present (not "tono")
  [/\bpitching\b/gi,'presenting'],[/\bpitched\b/gi,'presented'],
  [/\bpitch(?=\s+(?:your|my|our|to|it|ideas?|investors?)\b)/gi,'present'],
  // bold = brave / valiente (not "negrita")
  [/\bboldness\b/gi,'bravery'],[/\bboldly\b/gi,'bravely'],[/\bboldest\b/gi,'bravest'],[/\bbolder\b/gi,'braver'],[/\bbold\b/gi,'brave']
];
function glossCase(m,r){
  if(m.length>1&&m===m.toUpperCase())return r.toUpperCase();
  if(m[0]!==m[0].toLowerCase())return r[0].toUpperCase()+r.slice(1);
  return r;
}
function glossSub(s){for(const [re,r] of SUB)s=s.replace(re,m=>glossCase(m,r));return s}

/* =====================================================================
   TÚ (informal) instead of USTED (formal). Google writes formal Spanish ("su", "Cree", "Obtenga", "puede").
   After translating, the text is converted to informal "tú". Three safety rules:
   - possessives / "usted" / "le" are changed only when the English source says you/your and never he/she/his/her/its/they/their
   - verbs ("puede" -> "puedes", "podrá" -> "podrás", "pueda" -> "puedas") only when the source has "you" as a subject/object and no third person or "it"
   - commands ("Obtenga" -> "Obtén") are changed at the start of a sentence or after a comma / "y" / "o"
   To add a command verb, add it to IMP as 'formal:informal'.
   ===================================================================== */
const IMP_RAW=('Obtenga:Obtén,Obténgalo:Obtenlo,Haga:Haz,Hágalo:Hazlo,Háganos:Háznos,Póngase:Ponte,Descubra:Descubre,Descúbralo:Descúbrelo,Cree:Crea,Empiece:Empieza,Comience:Comienza,'+
'Solicite:Solicita,Solicítelo:Solicítalo,Reserve:Reserva,Contacte:Contacta,Contáctenos:Contáctanos,Llame:Llama,Llámenos:Llámanos,Únase:Únete,Regístrese:Regístrate,Inscríbase:Inscríbete,'+
'Suscríbase:Suscríbete,Pruebe:Prueba,Pruébelo:Pruébalo,Consulte:Consulta,Vea:Mira,Mire:Mira,Explore:Explora,Aprenda:Aprende,Lea:Lee,Elija:Elige,Seleccione:Selecciona,Escriba:Escribe,'+
'Escríbanos:Escríbenos,Envíe:Envía,Envíenos:Envíanos,Compre:Compra,Pida:Pide,Visite:Visita,Visítenos:Visítanos,Descargue:Descarga,Inicie:Inicia,Pague:Paga,Añada:Añade,Agregue:Agrega,'+
'Cambie:Cambia,Use:Usa,Utilice:Utiliza,Disfrute:Disfruta,Aproveche:Aprovecha,Mejore:Mejora,Aumente:Aumenta,Impulse:Impulsa,Lance:Lanza,Lleve:Lleva,Transforme:Transforma,'+
'Convierta:Convierte,Construya:Construye,Diseñe:Diseña,Conozca:Conoce,Conózcanos:Conócenos,Siga:Sigue,Síganos:Síguenos,Pregunte:Pregunta,Pregúntenos:Pregúntanos,Cuéntenos:Cuéntanos,'+

setInterval(()=>{const b=$('#tr'),p=T.on&&allCool();const t=p?'🌐⏳':'🌐';if(b.textContent!==t)b.textContent=t},1000);

setInterval(()=>{
  if(!T.on)return;
  track.querySelectorAll('iframe').forEach(fr=>{
    if(fr.dataset.mode!=='doc')return;
    const d=fr.contentDocument;
    if(!d||!d.documentElement||d.readyState!=='complete')return;
    if(d.__mo)walk(d.documentElement,d);else startTr(d);
  });
},12000);

loadList().then(list=>{
  S=list;
  track.innerHTML='';
  S.forEach(s=>{const d=document.createElement('div'),p=document.createElement('div');d.className='slide';p.className='ph';p.textContent=s.t;d.appendChild(p);track.appendChild(d)});
  // Start on a random site each time the page loads or is refreshed.
  // ?open=<page url or slug> (used by the Spanish cards on the landing page): start on that site
  const want=new URLSearchParams(location.search).get('open');
  const k=want?S.findIndex(o=>o.u===want||o.u.endsWith('/'+want+'.html')):-1;
  cur=k>=0?k:Math.floor(Math.random()*S.length);
  go(cur);
});
</script>
</body>
