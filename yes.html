<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Happy Yes Hall of Fame | EasyLandX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFD600;--blue:#0062CC;--red:#E8291C;--green:#25D366;--pink:#E8479A;--ink:#1A1208;--pad:clamp(22px,5vw,48px);
 --rb-bd:var(--red);--rb-bg:#fff4f2;--rb-h:var(--red);--cta-bg:var(--blue);--cta-fg:#fff}
body.yes{--rb-bd:var(--green);--rb-bg:#effcf3;--rb-h:#14803d;--cta-bg:var(--green);--cta-fg:var(--ink)}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",system-ui,sans-serif;color:var(--ink);background:var(--yellow);line-height:1.55}
h1,h2,h3,h4,.btn,.chip{font-family:"Poppins","Inter",system-ui,sans-serif}
.btn{display:inline-block;border:2px solid var(--ink);cursor:pointer;font-weight:700;font-size:.95rem;padding:12px 20px;border-radius:14px;text-decoration:none;color:#fff;box-shadow:4px 4px 0 var(--ink);transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn.blue{background:var(--blue)}.btn.red{background:var(--red)}
header.hero{padding:28px var(--pad) 48px}
.hero .wrap{max-width:900px;margin:0 auto}
.hero-top{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:30px}
.mode{display:inline-flex;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;box-shadow:5px 5px 0 var(--ink)}
.mode button{border:0;background:#fff;font:900 1.2rem "Poppins",sans-serif;letter-spacing:.03em;padding:12px 34px;cursor:pointer;color:var(--ink);transition:background .15s,color .15s}
.mode button+button{border-left:3px solid var(--ink)}
.mode button[data-m=yes].on{background:var(--green);color:var(--ink)}
.mode button[data-m=no].on{background:var(--red);color:#fff}
.mode button:focus-visible,.lang button:focus-visible{outline:3px solid var(--pink);outline-offset:-5px}
.lang{align-self:flex-end;display:inline-flex;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.lang button{display:flex;align-items:center;gap:9px;border:0;background:#fff;font:800 .95rem "Poppins",sans-serif;padding:11px 17px;cursor:pointer;color:var(--ink)}
.lang button+button{border-left:2px solid var(--ink)}
.lang button.on{background:var(--blue);color:#fff}
.lang svg{width:25px;height:18px;border-radius:2px;box-shadow:0 0 0 1px #0002}
@media(max-width:600px){header.hero{padding-top:20px;padding-bottom:38px}.hero-top{margin-bottom:24px}.lang button{padding:9px 13px}.mode button{padding:11px 28px}}
.hero h1{font-weight:900;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;letter-spacing:-.035em;margin:0 0 20px}
.hero p{font-size:1.12rem;max-width:640px;margin:0 0 26px}
.hero .row{display:flex;flex-wrap:wrap;gap:12px}
.controls{position:sticky;top:0;z-index:5;background:var(--yellow);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:12px var(--pad);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.controls input{padding:10px 14px;border-radius:12px;border:2px solid var(--ink);font:inherit;min-width:230px;max-width:100%;background:#fff}
#catChips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;font-size:.9rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--blue);color:#fff}
section.cat{padding:46px var(--pad)}
.inner{max-width:1100px;margin:0 auto}
.cat h2{font-weight:800;font-size:clamp(1.5rem,3.6vw,2.2rem);letter-spacing:-.02em;margin:0}
.cat .sub{margin:4px 0 24px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px}
.card{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.card:hover{transform:translate(-2px,-2px)}
.card.flash{animation:flash 1.5s}
@keyframes flash{0%,60%{background:#fff3a0}100%{background:#fff}}
.meter{font-size:.8rem;letter-spacing:1px}
.orig{font-family:"Poppins",sans-serif;font-weight:700;font-size:1.08rem;line-height:1.3;margin:0}
.rebut{border-left:6px solid var(--rb-bd);background:var(--rb-bg);border-radius:0 12px 12px 0;padding:10px 12px;font-size:.95rem;flex:1}
.rebut h4{margin:0 0 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--rb-h)}
.copy{align-self:flex-end;border:2px solid var(--ink);background:var(--green);color:var(--ink);border-radius:10px;padding:5px 14px;font:700 .82rem "Poppins",sans-serif;cursor:pointer}
.cta{background:var(--cta-bg);color:var(--cta-fg);text-align:center;padding:64px var(--pad)}
.cta h2{font-weight:900;font-size:clamp(1.8rem,4.5vw,3rem);letter-spacing:-.03em;margin:0 0 10px;line-height:1.08}
.cta p{max-width:560px;margin:0 auto 22px}
.cta .btn{background:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
footer{text-align:center;padding:22px var(--pad);font-size:.9rem;font-weight:500;border-top:3px solid var(--ink)}
.empty{text-align:center;padding:60px var(--pad);background:#fff0a0;font-weight:600}

/* ---- Your app section ---- */
.ap-cols{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,6vw,72px);align-items:center}
.ap-text h2{font-family:'Poppins',sans-serif;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-size:clamp(1.7rem,4.2vw,2.8rem);margin:0 0 14px}
.ap-lede{font-size:1.08rem;margin:0 0 22px;max-width:52ch}
.ap-points{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:12px}
.ap-points li{padding:12px 18px;border-left:5px solid var(--blue);background:#fff;border-radius:0 12px 12px 0;border-top:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.ap-points b{display:block;font-family:'Poppins',sans-serif;font-weight:800;font-size:1.08rem;color:var(--ink)}
.ap-points span{color:#4a4a4a;font-size:.95rem}
.ap-btns{display:flex;flex-wrap:wrap;gap:12px}
.ap-phone{width:min(320px,100%);margin:0 auto;background:var(--ink);border-radius:46px;padding:11px;box-shadow:0 30px 60px -20px rgba(0,20,60,.6),8px 8px 0 var(--blue);transform:rotate(3deg)}
.ap-screen{border-radius:36px;background:linear-gradient(170deg,#FFE35C,#FFFFFF 60%);padding:14px 20px 22px;color:var(--ink)}
.ap-status{display:flex;justify-content:space-between;font:700 .78rem 'Inter',sans-serif;padding:0 6px;margin-bottom:16px}
.ap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px;list-style:none;margin:0;padding:0}
.ap-grid li{text-align:center;font:600 .7rem/1.2 'Inter',sans-serif}
.ap-grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:22%;margin-bottom:5px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.ap-grid .yours{grid-column:1/-1;margin-top:6px}
.ap-grid .yours a{display:flex;align-items:center;gap:12px;padding:14px;border:2.5px dashed var(--blue);border-radius:20px;background:rgba(10,99,207,.08);text-align:left;text-decoration:none;font:700 .92rem/1.25 'Inter',sans-serif;color:var(--blue);animation:apPulse 2.6s ease-in-out infinite}
.ap-grid .yours b{flex:none;width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 1.6rem/1 'Poppins',sans-serif}
.ap-grid .yours small{display:block;font-weight:500;opacity:.8}
@keyframes apPulse{50%{transform:scale(1.03);background:rgba(10,99,207,.16)}}
@media(max-width:820px){.ap-cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.ap-grid .yours a{animation:none}}
.btn.pink{background:var(--pink)}
.ap-sec{background:#fff;border-top:3px solid var(--ink);padding:56px var(--pad)}
.ap-sec .ap-inner{max-width:1100px;margin:0 auto}
</style>
</head>

let mode='yes',lang='en',q='',catf='all';
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function applyStatic(){
 const T=M[mode].T;
 document.documentElement.lang=lang;document.body.className=mode;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T[lang][el.dataset.t]);
 document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=T[lang][el.dataset.ph]);
 $('lEn').classList.toggle('on',lang==='en');$('lEs').classList.toggle('on',lang==='es');
 $('mYes').textContent=lang==='en'?'YES':'SÍ';
 $('mYes').classList.toggle('on',mode==='yes');$('mNo').classList.toggle('on',mode==='no');
 $('mYes').setAttribute('aria-pressed',mode==='yes');$('mNo').setAttribute('aria-pressed',mode==='no');
 document.title=TITLE[mode][lang]+' | EasyLandX';
 applyApp();
}
function chips(){
 const{T,cats}=M[mode];
 $('catChips').innerHTML=[['all','✨',T[lang].all]].concat(cats.map((c,i)=>[String(i),c.e,c[lang][0]])).map(c=>
  `<button class="chip ${catf===c[0]?'on':''}" title="${esc(c[2])}" onclick="catf='${c[0]}';render()">${c[1]}</button>`).join('');
}
function render(){
 applyStatic();chips();
 const{T,cats,D}=M[mode],mt=METER[mode];
 const wrap=$('cats');wrap.innerHTML='';let total=0;
 cats.forEach((c,ci)=>{
  if(catf!=='all'&&catf!==String(ci))return;
  const items=D.map((d,i)=>({d,i})).filter(({d})=>d[0]===ci&&(!q||(d[2]+d[3]+d[4]+d[5]).toLowerCase().includes(q)));
  if(!items.length)return;
  total+=items.length;
  const sec=document.createElement('section');sec.className='cat';sec.style.background=c.bg;
  sec.innerHTML=`<div class="inner"><h2>${c.e} ${esc(c[lang][0])}</h2><p class="sub">${esc(c[lang][1])}</p><div class="grid">`+
  items.map(({d,i})=>`<article class="card" id="c${i}">
   <div class="meter" title="${mt[1]}">${mt[0].repeat(d[1])}</div>
   <p class="orig">“${esc(lang==='en'?d[3]:d[2])}”</p>
   <div class="rebut"><h4>${T[lang].reply}</h4>${esc(lang==='en'?d[5]:d[4])}</div>
   <button class="copy" onclick="copyReply(${i},this)">${T[lang].copy}</button>
  </article>`).join('')+`</div></div>`;
  wrap.appendChild(sec);
 });
 if(!total)wrap.innerHTML=`<div class="empty">${T[lang].empty}</div>`;
}
function setLang(l){lang=l;render()}
function setMode(m){if(m===mode)return;mode=m;q='';catf='all';$('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}
function copyReply(i,btn){
 const{T,D}=M[mode];
 const t=lang==='en'?D[i][5]:D[i][4];
 const done=()=>{btn.textContent=T[lang].copied;setTimeout(()=>btn.textContent=T[lang].copy,1200)};
 try{navigator.clipboard.writeText(t).then(done,done)}catch(e){done()}
}
function surprise(){
 q='';catf='all';$('search').value='';render();
 const el=$('c'+Math.floor(Math.random()*M[mode].D.length));
 el.scrollIntoView({behavior:'smooth',block:'center'});
 el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);
}
$('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
render();
