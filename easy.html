<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffd23f">
<title>EasyApps</title>
<style>
:root{--gold:#ffd23f;--cyan:#27f0ff;--deep:#1c0a5c;--w:min(100vw,560px,max(390px,50dvh))}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
html.touch,html.touch body{height:auto;overflow:visible;overscroll-behavior:none}
html.touch body{min-height:calc(100dvh + 400px)}
html{background:#ffd23f} /* colour around the notch / island: change here and in the theme-color meta */
body{background:transparent;color:#fff;font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:0;touch-action:none;cursor:grab}
.desk{--w:100vw}
.desk .screen{box-shadow:none}
.desk .bg{display:none}
.screen{position:fixed;top:0;bottom:0;width:var(--w);left:calc(50% - var(--w)/2);overflow:hidden;background:#12082e;z-index:1;box-shadow:0 0 70px rgba(0,0,0,.55)}
.track{position:absolute;inset:0;display:flex;will-change:transform}
.slide{flex:0 0 100%;position:relative;overflow:hidden;background:#12082e}
.slide.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.ph{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:12%;font-weight:800;font-size:20px;color:var(--gold)}
.ph small{font-weight:500;font-size:14px;color:#fff;opacity:.75}
.slide iframe{position:absolute;top:0;left:0;border:0;background:transparent;transform-origin:0 0}
.zone{position:absolute;top:0;bottom:0;width:26px;z-index:5;touch-action:none;cursor:grab}
.zl{left:0}.zr{right:0}
.glass{touch-action:pan-y;position:fixed;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:8px;border-radius:18px;background:rgba(24,8,72,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.45);width:min(96vw,500px)}
.bar{bottom:max(12px,env(safe-area-inset-bottom))}
.bar.min{width:auto}.bar.min>*:not(#tg):not(.count){display:none}
.count{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(6px);padding:5px 12px;border-radius:14px;background:rgba(24,8,72,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);font:700 13px/1 inherit;font-family:inherit;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
.count.show{opacity:1;transform:translateX(-50%)}
.b{border:0;border-radius:12px;padding:9px 11px;font:700 15px inherit;font-family:inherit;background:var(--gold);color:var(--deep);cursor:pointer;white-space:nowrap;text-decoration:none}
.b:active{transform:scale(.95)}
.b.alt{background:rgba(255,255,255,.18);color:#fff}
input{flex:1;min-width:0;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;padding:9px 11px;font:inherit;-webkit-user-select:text;user-select:text}
input:focus{outline:0;border-color:var(--cyan)}
.res{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:rgba(20,7,61,.95);border:1px solid rgba(255,255,255,.2);border-radius:14px;max-height:45vh;overflow:auto;display:none}
.res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.res div:hover,.res .on{background:rgba(39,240,255,.2)}
.res small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:19;background:rgba(0,0,0,.6);padding:7px 12px;border-radius:14px;font-size:12px;white-space:nowrap;pointer-events:none;animation:fade 6s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
@media(max-width:480px){.b{padding:9px 9px;font-size:14px}.glass{gap:6px;padding:7px}.hint{white-space:normal;width:86vw;text-align:center}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="screen" id="screen">
  <div class="track" id="track"></div>
</div>
<div class="glass bar" id="bar">
  <div class="res" id="res"></div>
  <div class="count" id="count"></div>
  <button class="b alt" id="prev" aria-label="Previous app">◀</button>
  <button class="b" id="rnd" aria-label="Random app">🎲</button>
  <input id="q" type="search" placeholder="Search apps…" autocomplete="off" aria-label="Page title and search">
  <a class="b alt" id="open" href="#" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">↗</a>
  <button class="b alt" id="lock" aria-label="Lock gestures to the app" aria-pressed="false" title="Lock: the app gets all gestures">✋</button>
  <button class="b alt" id="next" aria-label="Next app">▶</button>
  <button class="b alt" id="tg" aria-label="Hide or show controls">▾</button>
</div>
<div class="hint">Swipe ⇄ to change app · swipe ↕ to scroll · ✋ locks gestures to the app</div>

<script>
/* APP LIST: one line per app -> [url, emoji, title, description] */
const PAGES=[
  ["https://easylandx.github.io/", "🚀", "EasyLandX", "Landing pages and websites for small businesses."],
  ["https://easylandx.github.io/pawz/", "🐾", "PawVibesZ", "PawVibesZ app."],
  ["https://easylandx.github.io/fmpro/", "📻", "FMPro", "FMPro app."],
  ["https://easylandx.github.io/beopro/", "🔊", "BeoPro", "BeoPro app."],
  ["https://easylandx.github.io/tapepro/", "📼", "TapePro", "TapePro app."],
  ["https://easylandx.github.io/notes/", "📝", "NoteApp", "Notes app."],
  ["https://easylandx.github.io/chatapp/", "💬", "ChatApp", "Chat app."],
  ["https://easylandx.github.io/lcdpro/", "📟", "LCDPro", "LCDPro app."],
  ["https://easylandx.github.io/dispo/", "💿", "DisPro", "DisPro app."],
  ["https://easylandx.github.io/polapro/", "📸", "PolaPro", "PolaPro app."],
  ["https://easylandx.github.io/selec/", "⌨️", "Selectric", "Selectric app."],
  ["https://easylandx.github.io/super8/", "🎥", "Super8", "Super 8 camera app."],
  ["https://easylandx.github.io/time/", "🕰️", "TimePro", "Neon analog clock."],
  ["https://easylandx.github.io/artpro/", "🖼️", "ArtPro", "Walkable 3D virtual art gallery."],
  ["https://easylandx.github.io/bible/", "📖", "BiblePro", "BiblePro app."],
  ["https://easylandx.github.io/rolo/", "📇", "RoloPro", "RoloPro app."],
  ["https://easylandx.github.io/catpro/", "🐱", "CatPro", "CatPro app."],
  ["https://easylandx.github.io/face/", "🙂", "FacePro", "FacePro app."]
];
const EMB=/[?&]desk=1/.test(location.search);
if(!EMB&&matchMedia('(pointer:coarse)').matches)document.documentElement.classList.add('touch');
let W=390; // page width in CSS px: phone width, or the real window width on desktop
const $=s=>document.querySelector(s), track=$('#track'), scr=$('#screen'), q=$('#q'), res=$('#res');
const S=PAGES.map(([u,ic,t,d])=>({u,t:ic+' '+t,d}));
const ALLOW=['fullscreen','autoplay','camera','microphone','geolocation','accelerometer','gyroscope','magnetometer','xr-spatial-tracking','clipboard-read','clipboard-write','web-share','gamepad'].map(p=>p+' *').join('; ');
const cache=new Map(), GAIN=2.8; // GAIN = how much faster than the finger an app scrolls
let locked=false;
const HOME='https://easylandx.github.io/';
let cur=0, playing=false; // playing = the user is inside the current site

function sizeF(f){const k=scr.clientWidth/W;f.style.width=W+'px';f.style.height=(scr.clientHeight/k)+'px';f.style.transform='scale('+k+')'}
function sync(){ // keep only the current site and its two neighbours loaded
  [...track.children].forEach((sl,i)=>{
    const need=Math.abs(i-cur)<=1, f=sl.querySelector('iframe');
    if(need&&!f)mkFrame(i);
    else if(!need&&f)f.remove();
  });
}
function mkFrame(i){
  const fr=document.createElement('iframe');
  fr.title=S[i].t;
  fr.allow=ALLOW;
  fr.addEventListener('load',()=>{
    fr.style.background='#fff'; // white behind loaded apps
    const ok=hook(fr);zones(fr.parentNode,!ok);
    if(!ok&&!document.querySelector('.warn')){ // say why the middle of the screen can't be swiped
      const w=document.createElement('div');w.className='hint warn';
      w.textContent='Mouse swipe and scroll are limited here. Open this page from easylandx.github.io';
      document.body.appendChild(w);setTimeout(()=>w.remove(),6000);
    }
  });
  track.children[i].appendChild(fr);sizeF(fr);
  loadDoc(fr,i);
}
// Swiping and scrolling anywhere needs access to the app's page:
//  - showcase on the same site as the app: load it normally
//  - otherwise: fetch it and inject it with srcdoc (what ipad.html does)
//  - if neither works: normal embed, swipe from the edges
async function loadDoc(fr,i){
  let u=S[i].u;
  if(u===HOME){ // the home page only redirects: load its destination directly so it stays swipeable
    const es=(navigator.languages||[navigator.language]).some(l=>/^es(-|$)/i.test(l||''));
    u=HOME+'app/'+(es?'ease.html':'');
  }
  if(new URL(u).origin===location.origin){fr.src=u;return}
  try{
    let h=cache.get(i);
    if(!h){
      const r=await fetch(u);if(!r.ok)throw 0;
      h=await r.text();
      const b='<base href="'+(r.url||u)+'">'; // r.url includes the final "/" after a redirect
      h=/<head(\s[^>]*)?>/i.test(h)?h.replace(/<head(\s[^>]*)?>/i,m=>m+b):b+h;
      cache.set(i,h);
    }
    if(!fr.isConnected)return;
    fr.dataset.mode='doc';fr.srcdoc=h;
  }catch(e){if(fr.isConnected)fr.src=u}
}
function zones(sl,on){
  sl.querySelectorAll('.zone').forEach(z=>z.remove());
  if(on)['zl','zr'].forEach(c=>{const z=document.createElement('div');z.className='zone '+c;sl.appendChild(z);swipe(z)});
}
function hook(fr,inner){ // inner = a document in a frame inside the app (e.g. Super8)
  let d;try{d=inner||fr.contentDocument}catch(e){return false}
  if(!d||!d.documentElement||!fr.getAttribute('src')&&!fr.dataset.mode)return false;
  if(d.URL==='about:blank')return false;
  if(d._hooked)return true;d._hooked=true;fr.dataset.hooked='1';
  const st=d.createElement('style');
  st.textContent='html.ez,html.ez body{-webkit-user-select:none!important;user-select:none!important;cursor:grab}html.ez{scroll-behavior:auto!important}html.ez *{-webkit-user-drag:none;touch-action:none!important}html.ez input,html.ez textarea{-webkit-user-select:text!important;user-select:text!important}';
  (d.head||d.documentElement).appendChild(st);
  d.documentElement.classList.toggle('ez',!locked);
  const watch=f=>{ // hook frames inside the app too, now and each time they load
    if(f._watched)return;f._watched=true;
    const run=()=>{try{hook(fr,f.contentDocument)}catch(e){}};
    f.addEventListener('load',run);run();
  };
  d.querySelectorAll('iframe').forEach(watch);
  new d.defaultView.MutationObserver(()=>d.querySelectorAll('iframe').forEach(watch)).observe(d.documentElement,{childList:true,subtree:true});
  (fr._docs||(fr._docs=new Set())).add(d);
  const el=t=>t&&t.nodeType===1?t:t&&t.parentElement;
  const skip=t=>{t=el(t);return !!(t&&t.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])'))};
  d.addEventListener('selectstart',e=>{if(!locked&&!skip(e.target))e.preventDefault()});
  d.addEventListener('dragstart',e=>{if(!locked)e.preventDefault()});
  const root=()=>d.scrollingElement||d.documentElement;
  const scroller=t=>{ // the box under the finger that can actually scroll, else the page
    for(let n=el(t);n&&n!==d.body&&n!==d.documentElement;n=n.parentElement){
      if(n.scrollHeight>n.clientHeight+2&&/(auto|scroll)/.test(d.defaultView.getComputedStyle(n).overflowY))return n;
    }
    return root();
  };
  let id=null,x0=0,y0=0,t0=0,box=null,top0=0,mode=null,moved=false,vy=0,ly=0,lt=0,dxs=0;
  d.addEventListener('pointerdown',e=>{
    moved=false;
    if(locked||e.button!==0||skip(e.target))return;
    cancelAnimationFrame(fr._raf);
    id=e.pointerId;x0=e.screenX;y0=ly=e.screenY;lt=t0=performance.now();
    box=scroller(e.target);top0=box.scrollTop;mode=null;vy=0;dxs=0;
  },true);
  d.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;
    const dx=e.screenX-x0,dy=e.screenY-y0,k=scr.clientWidth/W;
    if(!mode){
      if(Math.hypot(dx,dy)<8)return;
      mode=Math.abs(dx)>Math.abs(dy)?'h':'v';moved=true;
      try{d.documentElement.setPointerCapture(id)}catch(_){}
      if(mode==='h')track.style.transition='none';
    }
    if(mode==='h'){
      dxs=dx;
      track.style.transform='translateX(calc('+(-cur*100)+'% + '+dxs+'px))';
    }else{
      box.scrollTop=top0-dy/k*GAIN;
      const n=performance.now();vy=(e.screenY-ly)/k*GAIN/Math.max(1,n-lt);ly=e.screenY;lt=n;
    }
  },true);
  const up=e=>{
    if(e.pointerId!==id)return;id=null;
    if(moved)enterFS();
    if(mode==='h')endH(dxs,performance.now()-t0);
    else if(mode==='v'&&Math.abs(vy)>.1){
      let v=vy;const b=box;
      const step=()=>{userAct();b.scrollTop-=v*16;v*=.965;if(Math.abs(v)>.02)fr._raf=requestAnimationFrame(step)};
      step();
    }
    mode=null;
  };
  d.addEventListener('pointerup',up,true);d.addEventListener('pointercancel',up,true);
  d.defaultView.addEventListener('click',e=>{
    if(moved){moved=false;e.preventDefault();e.stopImmediatePropagation();return} // no accidental click after a drag
    playing=true; // a real tap: stay on this app
    if(fr.dataset.mode!=='doc')return;
    const a=el(e.target)&&el(e.target).closest('a[href]');if(!a)return;
    const h=a.getAttribute('href');
    if(h[0]==='#'){e.preventDefault();const t=d.getElementById(decodeURIComponent(h.slice(1)));if(t)t.scrollIntoView({behavior:'smooth'})}
    else if(/^https?:/.test(a.href)){e.preventDefault();window.open(a.href,'_blank','noopener')}
  },true);
  ['pointerdown','pointermove','touchstart','touchmove','wheel','keydown','scroll'].forEach(ev=>d.addEventListener(ev,userAct,{passive:true,capture:true}));
  d.addEventListener('pointerdown',()=>{held=true},true);
  ['pointerup','pointercancel'].forEach(ev=>d.addEventListener(ev,()=>{held=false;userAct()},true));
  d.addEventListener('wheel',e=>{if(!locked)wheelNav(e)},{passive:false});
  d.addEventListener('keydown',e=>{
    if(locked||skip(e.target))return;
    if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
  });
  return true;
}
$('#lock').onclick=()=>{ // locked = the app gets every gesture (drawing, 3D, maps)
  locked=!locked;
  $('#lock').textContent=locked?'🔒':'✋';$('#lock').setAttribute('aria-pressed',locked);
  track.querySelectorAll('iframe[data-hooked]').forEach(f=>f._docs.forEach(d=>{if(d.documentElement)d.documentElement.classList.toggle('ez',!locked)}));
};
function ui(){
  if(document.activeElement!==q)q.value=S[cur].t; // the search box shows the current site title
  $('#open').href=S[cur].u;
}
function go(i){
  i=(i+S.length)%S.length;
  const far=Math.abs(i-cur)>1,chg=i!==cur;
  if(chg){playing=false;const a=document.activeElement;if(a&&a.tagName==='IFRAME')a.blur()}
  cur=i; sync();
  track.style.transition=far?'none':'transform .35s cubic-bezier(.2,.8,.2,1)';
  track.style.transform='translateX('+(-cur*100)+'%)';
  if(far){const sl=track.children[cur];sl.classList.remove('pop');void sl.offsetWidth;sl.classList.add('pop')}
  ui();
  if(chg)showCount();
}
let ct;
function showCount(){ // small temporary site counter above the search box
  const c=$('#count');c.textContent=(cur+1)+' / '+S.length;c.classList.add('show');
  clearTimeout(ct);ct=setTimeout(()=>c.classList.remove('show'),1300);
}
function rnd(){if(S.length<2)return;let i;do{i=Math.floor(Math.random()*S.length)}while(i===cur);go(i)}

let fsTried=false;
function enterFS(){ // touch devices: go full screen on the first swipe (hides the browser bars where supported)
  if(EMB||fsTried||!matchMedia('(pointer:coarse)').matches)return;
  const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!f)return;fsTried=true;
  try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{fsTried=false})}catch(e){fsTried=false}
}
let wl=0;
function wheelNav(e){
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>15){
    e.preventDefault();const n=Date.now();
    if(n-wl>450){wl=n;go(cur+(e.deltaX>0?1:-1))}
  }
}
function endH(dx,dt){
  const v=dx/Math.max(1,dt),th=scr.clientWidth*.18;
  if(dx<-th||(v<-.5&&dx<-30))go(cur+1);
  else if(dx>th||(v>.5&&dx>30))go(cur-1);
  else go(cur);
}
// swipe left/right on the edges, the bottom bar and the bezel
function swipe(el,bezelOnly){
  let x0=0,t0=0,on=false;
  el.addEventListener('pointerdown',e=>{
    if(bezelOnly&&e.target!==el)return;
    if(e.target.closest('button,a,input,.res'))return;
    on=true;x0=e.clientX;t0=performance.now();el.setPointerCapture(e.pointerId);track.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!on)return;
    track.style.transform='translateX(calc('+(-cur*100)+'% + '+(e.clientX-x0)+'px))';
  });
  const end=e=>{
    if(!on)return;on=false;enterFS();
    endH(e.clientX-x0,performance.now()-t0);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',wheelNav,{passive:false});
}
swipe($('#bg'),true);
swipe($('#bar'));

// search
let hits=[],sel=0;
function show(){
  const v=q.value.trim().toLowerCase();
  res.innerHTML='';
  if(!v){res.style.display='none';hits=[];return}
  hits=S.map((s,i)=>({s,i})).filter(o=>(o.s.t+' '+o.s.d+' '+o.s.u).toLowerCase().includes(v)).slice(0,8);
  sel=0;
  hits.forEach((o,k)=>{
    const d=document.createElement('div'),b=document.createElement('b'),sm=document.createElement('small');
    b.textContent=o.s.t;sm.textContent=o.s.d||o.s.u;d.append(b,sm);
    if(!k)d.className='on';
    d.onmousedown=e=>{e.preventDefault();pick(o.i)};
    res.appendChild(d);
  });
  if(!hits.length){const d=document.createElement('div');d.textContent='No apps found';res.appendChild(d)}
  res.style.display='block';
}
function pick(i){q.value='';res.style.display='none';q.blur();go(i)}
q.addEventListener('input',show);
q.addEventListener('focus',()=>setTimeout(()=>q.select(),0));
q.addEventListener('blur',()=>{res.style.display='none';q.value=S[cur].t});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&hits[sel])pick(hits[sel].i);
  else if(e.key==='Escape'){q.value='';show();q.blur()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!hits.length)return;
    sel=(sel+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;
    [...res.children].forEach((c,k)=>c.classList.toggle('on',k===sel));
  }
});
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur+1);
$('#rnd').onclick=rnd;
['pointerup','touchend'].forEach(ev=>$('#bar').addEventListener(ev,enterFS,{passive:true}));
$('#tg').onclick=()=>{const m=$('#bar').classList.toggle('min');$('#tg').textContent=m?'▴':'▾'};
addEventListener('keydown',e=>{
  if(document.activeElement===q)return;
  if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
  else if(e.key==='r'||e.key==='R')rnd();
  else if(e.key==='/'){e.preventDefault();q.focus()}
});
function layout(){ // desktop (mouse + wide window): whole window; otherwise phone layout
  const desk=EMB||(matchMedia('(pointer:fine)').matches&&innerWidth>=800);
  document.body.classList.toggle('desk',desk);
  W=desk?Math.max(innerWidth,1024):390;
  track.querySelectorAll('iframe').forEach(sizeF);
}

// auto-advance: next site every 8 s while idle. It pauses after any activity (resumes after 16 s) and stays paused once you click into the current site
const AP_EVERY=8000, AP_IDLE=16000;
let lastAct=0, lastAdv=Date.now(), held=false;
function apStart(){
  setInterval(()=>{
    const n=Date.now();
    if(playing||held||document.hidden||document.activeElement===q||S.length<2)return;
    if(n-lastAct<AP_IDLE||n-lastAdv<AP_EVERY)return;
    lastAdv=n;go(cur+1);
  },500);
}
function userAct(){lastAct=Date.now()}
['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend','wheel','keydown','click','scroll'].forEach(ev=>document.addEventListener(ev,userAct,{passive:true,capture:true}));
['pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{held=true},{passive:true,capture:true}));
['pointerup','pointercancel','touchend','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>{held=false;userAct()},{passive:true,capture:true}));
// clicks inside another site can't be seen directly, but they move focus into its frame
addEventListener('blur',()=>setTimeout(()=>{
  const a=document.activeElement;
  if(a&&a.tagName==='IFRAME'&&!a.dataset.hooked&&a.parentNode===track.children[cur]){playing=true;userAct()}
},0));

S.forEach(s=>{
