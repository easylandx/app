<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EasyLandX · iPad Pro M5 Showcase</title>
<style>
:root{--gold:#ffd23f;--cyan:#27f0ff;--deep:#1c0a5c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% 25%,#5b14ff,#1c0a5c 75%);color:#fff;font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;-webkit-user-select:none;user-select:none}
.stage{position:relative;width:min(94vw,calc((100dvh - 128px)*.75));aspect-ratio:3/4;container-type:inline-size;flex:none}
.ipad{position:absolute;inset:0;padding:2.4cqw;border-radius:5.4cqw;background:linear-gradient(145deg,#55555c,#1a1a1e 38%,#2e2e34 70%,#4a4a50);box-shadow:0 0 0 .25cqw #0b0b0d,0 3cqw 8cqw rgba(0,0,0,.55),inset 0 0 .6cqw rgba(255,255,255,.35);touch-action:none;cursor:grab}
.ipad:before{content:"";position:absolute;inset:.9cqw;border-radius:4.6cqw;background:#050507;pointer-events:none}
.hw{position:absolute;background:#3a3a41;border-radius:.4cqw}
.pw{top:-.7cqw;right:13cqw;width:7cqw;height:.9cqw}
.v1,.v2{right:-.7cqw;width:.9cqw;height:6cqw}.v1{top:15cqw}.v2{top:23cqw}
.cam{position:absolute;top:.8cqw;left:50%;width:.9cqw;height:.9cqw;margin-left:-.45cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3c4f7a,#05070d 70%);z-index:3}
.screen{position:relative;width:100%;height:100%;border-radius:3.1cqw;overflow:hidden;background:#12082e;z-index:2}
.track{position:absolute;inset:0;display:flex;will-change:transform}
.slide{flex:0 0 100%;position:relative;overflow:hidden;background:#12082e}
.slide.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12%;font-weight:800;font-size:4.2cqw;color:var(--gold)}
.slide iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0}
.zone{position:absolute;z-index:5;touch-action:none;cursor:grab}
.zl,.zr{top:0;bottom:0;width:6cqw}.zl{left:0}.zr{right:0}
.zl:after,.zr:after{content:"";position:absolute;top:50%;width:.8cqw;height:14cqw;margin-top:-7cqw;border-radius:1cqw;background:rgba(255,255,255,.55);box-shadow:0 0 1cqw rgba(0,0,0,.5);opacity:.8}
.zl:after{left:1cqw}.zr:after{right:1cqw}
.zh{left:20%;right:20%;bottom:0;height:4cqw}
.zh:after{content:"";position:absolute;left:50%;bottom:1.1cqw;width:22cqw;height:.8cqw;margin-left:-11cqw;border-radius:1cqw;background:rgba(255,255,255,.75);box-shadow:0 0 1cqw rgba(0,0,0,.6)}
.bar{position:relative;display:flex;gap:8px;width:min(94vw,620px)}
.b{border:0;border-radius:12px;padding:10px 14px;font:700 15px inherit;font-family:inherit;background:var(--gold);color:var(--deep);cursor:pointer;white-space:nowrap}
.b:active{transform:scale(.96)}
.b.alt{background:rgba(255,255,255,.16);color:#fff}
input{flex:1;min-width:0;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;padding:10px 12px;font:inherit;-webkit-user-select:text;user-select:text}
input:focus{outline:0;border-color:var(--cyan)}
.res{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:#14073d;border:1px solid rgba(255,255,255,.2);border-radius:12px;max-height:40vh;overflow:auto;display:none;z-index:9}
.res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.res div:hover,.res .on{background:rgba(39,240,255,.2)}
.res small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{font-size:13px;opacity:.85;text-align:center;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info a{color:var(--cyan);text-decoration:none;font-weight:700}
.brand{position:fixed;right:12px;bottom:12px;background:var(--gold);color:var(--deep);font-weight:800;font-size:13px;padding:8px 12px;border-radius:20px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="stage">
  <div class="ipad" id="ipad">
    <i class="hw pw"></i><i class="hw v1"></i><i class="hw v2"></i><i class="cam"></i>
    <div class="screen" id="screen">
      <div class="track" id="track"><div class="slide"><div class="ph">Loading sites…</div></div></div>
      <div class="zone zl" id="zl"></div>
      <div class="zone zr" id="zr"></div>
      <div class="zone zh" id="zh"></div>
    </div>
  </div>
</div>
<div class="info"><span id="lbl">Loading…</span> · <a id="open" href="#" target="_blank" rel="noopener">Open ↗</a></div>
<div class="bar">
  <div class="res" id="res"></div>
  <button class="b alt" id="prev" aria-label="Previous site">◀</button>
  <button class="b" id="rnd">🎲 Random</button>
  <input id="q" type="search" placeholder="Search sites…" autocomplete="off">
  <button class="b alt" id="next" aria-label="Next site">▶</button>
</div>
<div class="info" style="opacity:.6">Scroll inside the screen · swipe the screen edges, bezel or home bar ⇄ · ← → keys · “/” to search</div>
<a class="brand" href="https://easylandx.github.io/all/" target="_blank" rel="noopener">🧲 EasyLandX</a>

<script>
const IDX='https://easylandx.github.io/all/', W=1032; // iPad Pro 13" CSS width
const $=s=>document.querySelector(s), track=$('#track'), scr=$('#screen'), q=$('#q'), res=$('#res');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const FALL='work make give disc parad core swan scou how brai trig change influence social human choice'.split(' ');
let S=[], cur=0;

async function loadList(){
  let list=[];
  try{
    const t=await (await fetch(IDX)).text(), seen=new Set();
    const d=new DOMParser().parseFromString(t,'text/html');
    d.querySelectorAll('a[href]').forEach(a=>{
      let u; try{u=new URL(a.getAttribute('href'),IDX)}catch(e){return}
      if(!/\/all\/[\w-]+\.html$/.test(u.pathname)||/\/index\.html$/.test(u.pathname)||seen.has(u.href))return;
      seen.add(u.href);
      let L=[...a.querySelectorAll('*')].filter(e=>!e.children.length).map(e=>e.textContent.trim()).filter(x=>x&&!/^Open\s*→?$/.test(x));
      if(!L.length)L=[a.textContent.replace(/Open\s*→/,'').trim()||cap(u.pathname.split('/').pop().replace('.html',''))];
      let ic=''; if(L.length>1&&/^[^\p{L}\p{N}]{1,8}$/u.test(L[0]))ic=L.shift();
      list.push({u:u.href,t:(ic?ic+' ':'')+L[0],d:L.slice(1).join(' ')});
    });
    if(list.length<20){ // page may be script-rendered: scan raw text for page names
      list=[]; seen.clear();
      for(const m of t.matchAll(/["'(\/]([a-z0-9-]+)\.html/gi)){
        const s=m[1]; if(['index','all'].includes(s)||seen.has(s))continue; seen.add(s);
        list.push({u:IDX+s+'.html',t:cap(s),d:''});
      }
    }
  }catch(e){}
  if(list.length<5) list=FALL.map(s=>({u:IDX+s+'.html',t:cap(s),d:''}));
  return list;
}

function sizeF(f){const k=scr.clientWidth/W;f.style.width=W+'px';f.style.height=(scr.clientHeight/k)+'px';f.style.transform='scale('+k+')'}
function sync(){
  [...track.children].forEach((sl,i)=>{
    const need=Math.abs(i-cur)<=1, f=sl.querySelector('iframe');
    if(need&&!f){const fr=document.createElement('iframe');fr.src=S[i].u;fr.title=S[i].t;fr.allow='fullscreen';sl.appendChild(fr);sizeF(fr)}
    else if(!need&&f)f.remove();
  });
}
function ui(){
  $('#lbl').textContent=(cur+1)+' / '+S.length+' · '+S[cur].t;
  $('#open').href=S[cur].u;
}
function go(i){
  i=(i+S.length)%S.length;
  const far=Math.abs(i-cur)>1; cur=i; sync();
  track.style.transition=far?'none':'transform .35s cubic-bezier(.2,.8,.2,1)';
  track.style.transform='translateX('+(-cur*100)+'%)';
  if(far){const sl=track.children[cur];sl.classList.remove('pop');void sl.offsetWidth;sl.classList.add('pop')}
  ui();
}
function rnd(){if(S.length<2)return;let i;do{i=Math.floor(Math.random()*S.length)}while(i===cur);go(i)}

// swipe left/right on edges, home bar and bezel (cross-site iframes can't pass gestures to the parent)
function swipe(el,bezelOnly){
  let x0=0,t0=0,on=false;
  el.addEventListener('pointerdown',e=>{
    if(bezelOnly&&e.target!==el)return;
    on=true;x0=e.clientX;t0=performance.now();el.setPointerCapture(e.pointerId);track.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!on)return;
    track.style.transform='translateX(calc('+(-cur*100)+'% + '+(e.clientX-x0)+'px))';
  });
  const end=e=>{
    if(!on)return;on=false;
    const dx=e.clientX-x0,v=dx/Math.max(1,performance.now()-t0),th=scr.clientWidth*.18;
    if(dx<-th||(v<-.5&&dx<-30))go(cur+1);
    else if(dx>th||(v>.5&&dx>30))go(cur-1);
    else go(cur);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>20){e.preventDefault();go(cur+(e.deltaX>0?1:-1))}},{passive:false});
}
['#zl','#zr','#zh'].forEach(s=>swipe($(s)));
swipe($('#ipad'),true);

// search
let hits=[],sel=0;
function show(){
  const v=q.value.trim().toLowerCase();
  res.innerHTML='';
  if(!v){res.style.display='none';hits=[];return}
  hits=S.map((s,i)=>({s,i})).filter(o=>(o.s.t+' '+o.s.d+' '+o.s.u).toLowerCase().includes(v)).slice(0,8);
  sel=0;
  hits.forEach((o,k)=>{
    const d=document.createElement('div'),b=document.createElement('b'),sm=document.createElement('small');
    b.textContent=o.s.t;sm.textContent=o.s.d||o.s.u;d.append(b,sm);
    if(!k)d.className='on';
    d.onmousedown=e=>{e.preventDefault();pick(o.i)};
    res.appendChild(d);
  });
  if(!hits.length){const d=document.createElement('div');d.textContent='No sites found';res.appendChild(d)}
  res.style.display='block';
}
function pick(i){q.value='';res.style.display='none';q.blur();go(i)}
q.addEventListener('input',show);
q.addEventListener('blur',()=>res.style.display='none');
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&hits[sel])pick(hits[sel].i);
  else if(e.key==='Escape'){q.value='';show();q.blur()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!hits.length)return;
    sel=(sel+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;
    [...res.children].forEach((c,k)=>c.classList.toggle('on',k===sel));
  }
});
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur+1);
$('#rnd').onclick=rnd;
addEventListener('keydown',e=>{
  if(document.activeElement===q)return;
  if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
  else if(e.key==='r'||e.key==='R')rnd();
  else if(e.key==='/'){e.preventDefault();q.focus()}
});
new ResizeObserver(()=>track.querySelectorAll('iframe').forEach(sizeF)).observe(scr);

loadList().then(list=>{
  S=list;
  track.innerHTML='';
  S.forEach(s=>{const d=document.createElement('div'),p=document.createElement('div');d.className='slide';p.className='ph';p.textContent=s.t;d.appendChild(p);track.appendChild(d)});
  cur=0;go(0);
});
</script>
</body>
</html>
